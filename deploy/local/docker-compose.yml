services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  broker:
    build:
      context: ../..
      dockerfile: packages/broker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      DAYTONA_API_URL: ${DAYTONA_API_URL:-http://host.docker.internal:3000/api}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-us}
      MAX_SANDBOX_CONCURRENCY: ${MAX_SANDBOX_CONCURRENCY:-2}
      IDLE_POLICY: ${IDLE_POLICY:-stop_keep}
      DEFAULT_BROKER_MODE: ${DEFAULT_BROKER_MODE:-exclusive}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
