services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  sandbox-runtime:
    build:
      context: ../..
      dockerfile: packages/sandbox-runtime/Dockerfile
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      RUNTIME_BACKEND: ${RUNTIME_BACKEND:-e2b}
      E2B_IMAGE: ${E2B_IMAGE:-sandbox-dev/e2b-runtime:0.1.0}
      E2B_DEFAULT_CPU: ${SANDBOX_CPU:-0.5}
      E2B_DEFAULT_MEMORY_MIB: ${SANDBOX_MEMORY_MIB:-512}
      E2B_WORK_DIR: ${E2B_WORK_DIR:-/home/user/project}
      AIO_IMAGE: ${AIO_IMAGE:-sandbox-dev/aio-runtime:0.1.0}
      AIO_WORK_DIR: ${AIO_WORK_DIR:-/home/gem/workspace}
      AIO_API_KEY: ${AIO_API_KEY:-}
      AIO_READY_TIMEOUT_MS: ${AIO_READY_TIMEOUT_MS:-120000}
      AIO_DOCKER_NETWORK: ${AIO_DOCKER_NETWORK:-sandbox-dev-aio}
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - aio
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  broker:
    build:
      context: ../..
      dockerfile: packages/broker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-e2b}
      SANDBOX_SIZE_PROFILE: ${SANDBOX_SIZE_PROFILE:-small}
      SANDBOX_CPU: ${SANDBOX_CPU:-0.5}
      SANDBOX_MEMORY_MIB: ${SANDBOX_MEMORY_MIB:-512}
      SANDBOX_DISK_GIB: ${SANDBOX_DISK_GIB:-3}
      PROCESS_LIMIT_CPU_SECONDS: ${PROCESS_LIMIT_CPU_SECONDS:-}
      PROCESS_LIMIT_MEMORY_MIB: ${PROCESS_LIMIT_MEMORY_MIB:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-http://host.docker.internal:3000/api}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-us}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-}
      E2B_RUNTIME_URL: ${E2B_RUNTIME_URL:-http://sandbox-runtime:8090}
      E2B_IMAGE: ${E2B_IMAGE:-sandbox-dev/e2b-runtime:0.1.0}
      E2B_DEFAULT_CPU: ${SANDBOX_CPU:-0.5}
      E2B_DEFAULT_MEMORY_MIB: ${SANDBOX_MEMORY_MIB:-512}
      E2B_WORK_DIR: ${E2B_WORK_DIR:-/home/user/project}
      AIO_RUNTIME_URL: ${AIO_RUNTIME_URL:-http://sandbox-runtime:8090}
      AIO_IMAGE: ${AIO_IMAGE:-sandbox-dev/aio-runtime:0.1.0}
      AIO_WORK_DIR: ${AIO_WORK_DIR:-/home/gem/workspace}
      MAX_SANDBOX_CONCURRENCY: ${MAX_SANDBOX_CONCURRENCY:-2}
      IDLE_POLICY: ${IDLE_POLICY:-stop_keep}
      DEFAULT_BROKER_MODE: ${DEFAULT_BROKER_MODE:-exclusive}
      PROJECT_BASE_PATH: ${PROJECT_BASE_PATH:-}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      OPENCODE_SERVICE_ENABLED: ${OPENCODE_SERVICE_ENABLED:-false}
      OPENCODE_SERVICE_COMMAND: ${OPENCODE_SERVICE_COMMAND:-opencode serve --hostname 0.0.0.0 --port 4096}
      OPENCODE_SERVICE_PORT: ${OPENCODE_SERVICE_PORT:-4096}
      OPENCODE_SERVICE_PASSWORD: ${OPENCODE_SERVICE_PASSWORD:-}
      OPENCODE_SERVICE_READY_TIMEOUT_MS: ${OPENCODE_SERVICE_READY_TIMEOUT_MS:-60000}
      LEASE_TTL_MS: ${LEASE_TTL_MS:-120000}
      LEASE_SWEEP_INTERVAL_MS: ${LEASE_SWEEP_INTERVAL_MS:-30000}
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      sandbox-runtime:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # Daytona signed preview hosts resolve to the Docker host, not the broker container loopback.
      - "proxy.localhost:host-gateway"
    # Daytona SDK toolbox uses 127.0.0.1:4000; forward it to the host-published proxy.
    command:
      [
        "sh",
        "-c",
        "node /app/packages/broker/scripts/daytona-proxy-forward.mjs & exec node dist/index.js",
      ]

networks:
  aio:
    name: sandbox-dev-aio
    driver: bridge
